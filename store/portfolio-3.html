<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/site/styles.css"><link rel="stylesheet" href="/store/store.css"><script src="/store/inject.js" defer></script>
<style>
.canvas { width: 1600px; height: 640px; padding: 56px 64px; box-sizing: border-box; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.pair .tag { font-size: 20px; margin-top: 22px; }
.pair .tag i.bad { background: var(--ink-3); } .pair .tag i.good { background: var(--accent); }
</style></head><body><div class="canvas"><div class="pair">
  <div><div data-mac data-mode="chrome" data-offset="21" data-lang="en"></div><p class="tag"><i class="bad"></i>Chrome picture-in-picture</p></div>
  <div><div data-mac data-mode="floattube" data-offset="21" data-lang="en"></div><p class="tag"><i class="good"></i>FloatTube</p></div>
</div></div></body></html>
