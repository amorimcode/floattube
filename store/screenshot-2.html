<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="/site/styles.css"><link rel="stylesheet" href="/store/store.css"><script src="/store/inject.js" defer></script>
<style>
.canvas { width: 1280px; height: 800px; padding: 72px 64px 0; box-sizing: border-box; }
.canvas h1 { font-size: 52px; }
.canvas .lede { margin-top: 14px; font-size: 19px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 52px; }
.pair .tag i.bad { background: var(--ink-3); } .pair .tag i.good { background: var(--accent); }
.pair .note { font-size: 16px; color: var(--ink-2); margin-top: 6px; }
</style></head><body><div class="canvas">
<h1>No meio da troca de desktop:</h1><p class="lede">o PiP do Chrome desliza junto com o desktop. O FloatTube fica exatamente onde estava.</p>
<div class="pair">
  <div><div data-mac data-mode="chrome" data-offset="21"></div><p class="tag"><i class="bad"></i>PiP do Chrome</p><p class="note">sai deslizando e só reaparece no fim</p></div>
  <div><div data-mac data-mode="floattube" data-offset="21"></div><p class="tag"><i class="good"></i>FloatTube</p><p class="note">parado no mesmo pixel o tempo todo</p></div>
</div></div></body></html>
