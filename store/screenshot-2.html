<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="/site/styles.css"><link rel="stylesheet" href="/store/mock.css">
<style>
.canvas { width: 1280px; height: 800px; }
.head { position: absolute; top: 70px; left: 0; right: 0; text-align: center; }
.head h2 { font-size: 50px; margin: 0 0 12px; }
.head p { color: var(--ink-2); font-size: 20px; margin: 0; }
.compare { position: absolute; left: 60px; right: 60px; top: 250px; }
.strip { animation: none !important; transform: translateX(-24%); }
.demo figcaption { font-size: 18px; }
</style></head><body><div class="canvas"><div class="aurora"></div>
<div class="head"><h2>Troque de desktop. O player fica.</h2><p>No meio da animação de troca: o PiP do Chrome desliza junto; o FloatTube não se mexe.</p></div>
<div class="compare">
  <figure class="demo glass"><div class="screen"><div class="menubar"><i></i><i></i><i></i><i></i></div><div class="strip">
    <div class="desk desk-1"><div class="win win-a"></div><div class="win win-b"></div><span class="space-label">Desktop 1</span><div class="pip"><div class="pip-bar"></div></div></div>
    <div class="desk desk-2"><div class="win win-a"></div><div class="win win-b"></div><span class="space-label">Desktop 2</span><div class="pip"><div class="pip-bar"></div></div></div></div></div>
    <figcaption><span class="tag tag-bad">Antes</span><span><strong>PiP do Chrome:</strong> sai deslizando e reaparece</span></figcaption></figure>
  <figure class="demo glass"><div class="screen"><div class="menubar"><i></i><i></i><i></i><i></i></div><div class="strip">
    <div class="desk desk-1"><div class="win win-a"></div><div class="win win-b"></div><span class="space-label">Desktop 1</span></div>
    <div class="desk desk-2"><div class="win win-a"></div><div class="win win-b"></div><span class="space-label">Desktop 2</span></div></div>
    <div class="pip"><div class="pip-bar"></div></div></div>
    <figcaption><span class="tag tag-good">FloatTube</span><span><strong>Parado no mesmo pixel</strong> o tempo todo</span></figcaption></figure>
</div></div></body></html>
