<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mesma geometria do AppIcon.icon (tela cheia 1024), encaixada no grid de ícone do macOS. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFBE55"/>
      <stop offset="1" stop-color="#FF5F2E"/>
    </linearGradient>
    <radialGradient id="light" cx="0.25" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0E6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA23F"/>
      <stop offset="1" stop-color="#FF5A24"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#6B2208" opacity="0.26" filter="url(#iconShadow)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <g transform="translate(100 100) scale(0.8047)">
      <!-- a tela saindo pela esquerda (o desktop deslizando) -->
      <rect x="-70" y="214" width="700" height="480" rx="76" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="14"/>
      <!-- o mini player, parado, saltando para fora da tela -->
      <rect x="364" y="490" width="540" height="304" rx="68" fill="#7A2406" opacity="0.32" filter="url(#soft)"/>
      <rect x="364" y="462" width="540" height="304" rx="68" fill="url(#tile)"/>
      <path d="M598 556 L598 672 L699 614 Z" fill="url(#play)" stroke="url(#play)" stroke-width="30" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
