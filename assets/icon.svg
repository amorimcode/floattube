<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4146B8"/>
      <stop offset="0.5" stop-color="#1E2166"/>
      <stop offset="1" stop-color="#0A0C28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#9EA2FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9EA2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaving" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="arriving" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC95E"/>
      <stop offset="1" stop-color="#FF4F6E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity="0.3" filter="url(#iconShadow)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- dois desktops deslizando; a emenda passa por baixo do player -->
    <rect x="-40" y="236" width="500" height="430" rx="52" fill="url(#leaving)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>
    <rect x="504" y="236" width="500" height="430" rx="52" fill="url(#arriving)" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="8"/>
    <line x1="0" y1="298" x2="456" y2="298" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
    <line x1="508" y1="298" x2="1000" y2="298" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"/>

    <!-- player travado no lugar -->
    <rect x="296" y="522" width="432" height="243" rx="42" fill="#050616" opacity="0.6" filter="url(#soft)"/>
    <rect x="296" y="500" width="432" height="243" rx="42" fill="url(#pip)"/>
    <rect x="296" y="500" width="432" height="243" rx="42" fill="url(#shine)"/>
    <path d="M484 574 L484 670 L566 622 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>

    <!-- cantoneiras de "travado" -->
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <path d="M262 514 V466 H310"/>
      <path d="M714 466 H762 V514"/>
      <path d="M762 729 V777 H714"/>
      <path d="M310 777 H262 V729"/>
    </g>
  </g>
</svg>
